<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#00843d">
<title>نظام تطبيق حماية</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
/* VOICE  أداة عمل تُستخدم تحت الضغط: هادئة، واضحة، كبيرة الأزرار
   IDEA   لوحة مخرج الطوارئ: أخضر السلامة بكتابة بيضاء، والأحمر للخطر فقط
   PICTURE في كل شاشة الشيء العامل نفسه: قائمة الفصل، شبكة الفصول، الرمز
   COLOUR أخضر السلامة #00843d، أحمر الإنذار #d7262e، كهرماني للانتظار
   TYPE   IBM Plex Sans Arabic مع بدائل النظام
   LAYOUT عمود واحد للجوال، يتسع لعمودين في شاشة القائدة على الحاسب */
:root{color-scheme:light dark;--bg:light-dark(#f4f7f5,#0c1310);--card:light-dark(#ffffff,#141f1a);--ink:light-dark(#0e1a14,#e8f1ec);--mut:light-dark(#4d5e55,#9cb1a5);--line:light-dark(#d6e0da,#273830);--g:#00843d;--gd:#006a31;--g2:light-dark(#e2f3e8,#11331f);--r:#d7262e;--r2:light-dark(#fdeaea,#3a1517);--a:light-dark(#9a6400,#f0b43c);--a2:light-dark(#fff2d3,#36290b);--n2:light-dark(#eceff1,#222b27)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans Arabic",Tahoma,"Segoe UI","Noto Sans Arabic","Geeza Pro",sans-serif;overflow-x:clip;padding-bottom:96px}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:var(--g);color:#fff;padding:12px max(16px,4vw);display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.top h1{font-size:18px;margin:0;font-weight:700;flex:1;line-height:1.3}
.top small{display:block;font-weight:400;opacity:.85;font-size:13px}
.top button{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;min-height:40px;padding:0 12px;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:16px max(16px,4vw)}
h2{font-size:clamp(24px,5vw,32px);line-height:1.15;margin:8px 0 6px;letter-spacing:-.01em}
h3{font-size:18px;margin:22px 0 8px}
p.lead{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px;margin:14px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:start;cursor:pointer;min-height:96px;display:flex;flex-direction:column;gap:4px}
.tile b{font-size:19px}.tile span{color:var(--mut);font-size:14px}
.tile.main{background:var(--g);color:#fff;border-color:var(--g)}.tile.main span{color:#e3f6ea}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;text-decoration:none}
.btn.pri{background:var(--g);border-color:var(--g);color:#fff}
.btn.red{background:var(--r);border-color:var(--r);color:#fff}
.btn.big{min-height:62px;font-size:19px;width:100%}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn:focus-visible,.tile:focus-visible,.row:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
label.f{display:block;margin:10px 0}label.f span{display:block;font-size:14px;color:var(--mut);margin-bottom:4px}
input[type=text],input[type=number],select,textarea{width:100%;font-size:16px;min-height:46px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
textarea{min-height:120px;line-height:1.6}
.note{font-size:14px;color:var(--mut)}
.warn{background:var(--a2);border:1px solid var(--a);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15px}
.alarm{background:var(--r2);border:2px solid var(--r);border-radius:14px;padding:12px 14px;margin:10px 0}
.alarm h4{margin:0 0 6px;color:var(--r);font-size:18px}
.okbox{background:var(--g2);border:1px solid var(--g);border-radius:14px;padding:12px 14px;margin:10px 0}
.list{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-height:54px;cursor:pointer;text-align:start;width:100%}
.row .n{width:2.2em;color:var(--mut);font-variant-numeric:tabular-nums;flex:none}
.row .nm{flex:1;font-size:17px}
.row .sub{display:block;font-size:13px;color:var(--mut)}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap;flex:none}
.c-p{background:var(--g2);color:var(--g)}.c-i{background:var(--a2);color:var(--a)}.c-a,.c-e{background:var(--n2);color:var(--mut)}.c-o{background:var(--a2);color:var(--a)}.c-m{background:var(--r);color:#fff}.c-f{background:var(--g2);color:var(--g)}
.row.st-m{border-color:var(--r);background:var(--r2)}.row.st-o,.row.st-i{border-color:var(--a)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr));gap:8px;margin:10px 0}
.cls{border-radius:14px;padding:12px;min-height:88px;border:2px solid var(--line);background:var(--card);cursor:pointer;text-align:start;display:flex;flex-direction:column;gap:2px}
.cls b{font-size:20px}.cls span{font-size:13px;color:var(--mut)}
.cls.ok{border-color:var(--g);background:var(--g2)}.cls.bad{border-color:var(--r);background:var(--r2)}.cls.wait{border-color:var(--a);background:var(--a2)}
.timer{font-size:clamp(40px,11vw,64px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}.stat span{font-size:13px;color:var(--mut)}
.stat.r{border-color:var(--r)}.stat.r b{color:var(--r)}.stat.a b{color:var(--a)}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{flex:1 1 auto;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;padding:0 12px}
.seg button[aria-pressed=true]{background:var(--g);color:#fff;border-color:var(--g);font-weight:700}
.bar{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px max(16px,4vw) calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;z-index:15}
.bar .cnt{flex:1;font-size:15px;line-height:1.3}.bar .cnt b{font-size:24px;display:block}
.qr{background:#fff;padding:10px;border-radius:14px;max-width:340px;margin:10px auto;border:1px solid var(--line)}
.qr svg{display:block;width:100%;height:auto}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:min(640px,100%);max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px max(16px,4vw) calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin-top:0}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px}}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:center;white-space:nowrap}
th{background:var(--g2)}td.l{text-align:start;white-space:normal;min-width:8em}
.toast{position:fixed;inset-inline:16px;bottom:96px;margin:auto;max-width:520px;background:#0e1a14;color:#fff;border-radius:12px;padding:12px 16px;z-index:60;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
video{width:100%;border-radius:12px;background:#000;max-height:50vh}
details summary{cursor:pointer;font-weight:600;min-height:40px;display:flex;align-items:center}
.scen{border-inline-start:6px solid var(--line)}.k-out{border-inline-start-color:var(--g)}.k-in{border-inline-start-color:var(--a)}.k-lock{border-inline-start-color:var(--r)}.k-none{border-inline-start-color:var(--mut)}
.scen ol{margin:6px 0;padding-inline-start:26px;list-style:arabic-indic}
.two{display:grid;gap:12px}@media(min-width:860px){.two{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
@media print{.top,.bar,.btns,.noprint{display:none!important}body{background:#fff;color:#000;padding:0}.card{border:0}}
@media(prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translateY(12px);opacity:0}}}
</style>
</head>
<body>
<header class="top">
  <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="6" fill="#fff"/><rect x="5" y="6" width="11" height="22" rx="1.5" fill="#00843d"/><path d="M20 17h9m-4-4 4 4-4 4" stroke="#00843d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <h1 id="ttl">نظام تطبيق حماية<small id="sub">النسخة الميدانية</small></h1>
  <button type="button" data-a="home" id="homeBtn">الرئيسية</button>
</header>
<main class="wrap" id="app"></main>
<div id="bar"></div>
<div id="layer"></div>
<input type="file" id="fPhoto" accept="image/*" capture="environment" hidden>
<input type="file" id="fImg" accept="image/*" hidden>
<input type="file" id="fJson" accept=".json,application/json,text/plain" hidden>
<script src="config.js"></script>
<script src="vendor/qrcode.min.js"></script>
<script src="vendor/jsqr.min.js"></script>
<script>
/* إن لم تتوفر المكتبات محلياً تُحمّل من مصدرها العام */
if (!window.qrcode) document.write('<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"><\/script>');
if (!window.jsQR) document.write('<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"><\/script>');
</script>
<script>
{
/* ---------- ثوابت ---------- */
const KEY = 'himaya-field-v1';
const ST = {p:'حاضرة', i:'مصابة', a:'غائبة اليوم', e:'مستأذنة', o:'مع مجموعة أخرى', m:'مفقودة'};
const LS = {c:'كانت في الفصل', w:'خرجت لدورة المياه', k:'في العيادة', x:'مكان آخر', u:'لا أعرف'};
const LOC = {room:'قاعة الفصل', lab:'المعمل', gym:'الصالة أو الملعب', yard:'الساحة أو الفسحة', other:'مكان آخر'};
const EVT = {ann:'تمرين معلن', sur:'تمرين مفاجئ', desk:'تمرين مكتبي', real:'حدث فعلي'};
const KIND = {out:'إخلاء خارجي', in:'احتماء في المكان', lock:'إغلاق وإيواء', none:'لا إخلاء عام', mix:'حسب الموقف'};
const SCEN = [
 {t:'زلزال أو هزة أرضية', k:'out', r:'إخلاء كامل بعد انتهاء الهزة', s:['أثناء الهزة: انخفضي، احتمي، تمسّكي أسفل الطاولات بعيداً عن النوافذ والزجاج.','بعد توقف الهزة: جرس الإخلاء وإخلاء المبنى فوراً وبشكل منظم.','التوجه لنقطة التجمع بعيداً عن المباني والأعمدة.','حصر فوري للطالبات والمنسوبات والإبلاغ عن أي مفقودة.','منع العودة للمبنى حتى تفحصه الجهات المختصة.']},
 {t:'حريق داخل المبنى', k:'out', r:'إخلاء كامل فوري', s:['جرس الإنذار فوراً وإبلاغ الدفاع المدني (٩٩٨).','فصل التيار متى كان آمناً، ولا يُفصل مع مضخة حريق كهربائية إلا بإشراف الدفاع المدني.','الإخلاء عبر المسارات المحددة مع إغلاق الأبواب خلفكن.','التوجه لنقطة التجمع الخارجية وإجراء الحصر.','فريق الإطفاء يحاول السيطرة دون تعريض نفسه للخطر حتى وصول الدفاع المدني.']},
 {t:'حريق خارجي (أحراش أو مبانٍ مجاورة)', k:'mix', r:'إخلاء كامل للموقع أو بقاء في المكان', s:['تقييم اتجاه الريح وقرب النار بالتنسيق مع الجهات المختصة.','إن كان الخطر وشيكاً: إخلاء كامل إلى مدرسة مضيفة أو موقع خارج منطقة الخطر.','إن كان المبنى محمياً والطرق غير مناسبة: البقاء وإغلاق النوافذ ومداخل التكييف.','توجيه الطالبات إلى الحافلات أو المسار الآمن نحو الموقع البديل.']},
 {t:'تسرّب غاز', k:'out', r:'إخلاء كامل فوري', phone:1, s:['لا تُستخدم المفاتيح الكهربائية ولا الجوالات داخل المبنى.','فتح النوافذ والأبواب للتهوية متى أمكن بأمان.','إغلاق الصمام الرئيسي للغاز إن كان الوصول إليه آمناً.','إخلاء المبنى فوراً إلى نقطة تجمع بعيدة عن مصدر التسرب.','الاتصال بشركة الغاز والدفاع المدني من موقع آمن.']},
 {t:'تهديد بقنبلة أو جسم مشبوه', k:'out', r:'إخلاء كامل أو جزئي بتوجيه الخبراء', s:['عدم لمس الجسم وإخلاء المنطقة المحيطة فوراً.','الإخلاء الكامل عادةً بناءً على توجيهات الشرطة.','يجوز الإخلاء الجزئي إذا كان الجسم في منطقة معزولة وقررت الجهات المختصة ذلك.','التوجه إلى نقطة تجمع بعيدة ومنع الاقتراب من المبنى.']},
 {t:'إنذار وطني (حرب أو غارة جوية)', k:'lock', r:'احتماء في الملاجئ', s:['التوجه فوراً إلى الملاجئ أو الطوابق السفلية عند سماع الإنذار.','إغلاق جميع النوافذ والأبواب.','البقاء في الملجأ حتى صدور إشارة انتهاء الخطر.','انخفضي، احتمي، تمسّكي عند وقوع قصف.','متابعة تعليمات الدفاع المدني عبر القنوات الرسمية.']},
 {t:'إطلاق نار أو اقتحام مسلح', k:'lock', r:'إغلاق كامل', s:['إطلاق كود الإغلاق: أقفلي، أطفئي، اختفي عن الأنظار.','إغلاق الأبواب وتأمينها، إطفاء الأنوار، الاختباء بعيداً عن النوافذ والتزام الصمت.','الاتصال بالشرطة فوراً بالمعلومات المتاحة دون تعريض أحد للخطر.','لا إخلاء إلا بأمر الشرطة.']},
 {t:'إخلاء الموقع بالكامل (كارثة كبرى)', k:'out', r:'إخلاء كامل إلى موقع خارجي', s:['تفعيل الإخلاء بناءً على توجيهات الدفاع المدني أو الجهة العليا.','توجيه الطالبات إلى الحافلات المعدّة مسبقاً.','الانتقال إلى المدرسة المضيفة المحددة في الخطة.','حصر دقيق قبل المغادرة وعند الوصول.','إبلاغ أولياء الأمور عبر القنوات المعتمدة.']},
 {t:'إعصار أو عاصفة شديدة', k:'in', r:'بقاء في المكان داخل ملاجئ داخلية', s:['متابعة تحذيرات الأرصاد والرسائل الرسمية.','الانتقال إلى الطوابق السفلية أو الممرات الداخلية أو الغرف بلا نوافذ.','الابتعاد عن النوافذ والزجاج.','انخفضي، احتمي، تمسّكي مع حماية الرأس.']},
 {t:'تسرّب مواد خطرة خارج المدرسة', k:'in', r:'بقاء في المكان مع إغلاق المرافق', s:['إغلاق النوافذ والأبواب الخارجية.','إطفاء أنظمة التكييف ومنع دخول الهواء الخارجي.','البقاء في الفصول وانتظار تعليمات الدفاع المدني.','متابعة التعليمات عبر القنوات الرسمية.']},
 {t:'انقطاع الكهرباء لفترة طويلة', k:'none', r:'تعديل التشغيل أو إخلاء جزئي أو كامل', s:['تقييم أثر الانقطاع على التكييف والإضاءة والمصاعد وسلامة الطالبات.','إن بقي الوضع آمناً: تعديل التشغيل والاستفادة من الإضاءة الطبيعية.','إن أصبح غير آمن بسبب الحرارة أو الظلام: إخلاء جزئي أو كامل.','تشغيل الإضاءة الطارئة والمولدات إن كانت متاحة وآمنة.']},
 {t:'انهيار جزء من المبنى', k:'out', r:'إخلاء كامل فوري', s:['إطلاق الإنذار فوراً.','إخلاء المبنى بالكامل من المخارج الآمنة بعيداً عن منطقة الانهيار.','التوجه إلى نقطة تجمع بعيدة عن المبنى.','حصر فوري والإبلاغ عن المفقودات أو من يُحتمل وجودهن تحت الأنقاض.','منع العودة إلى المبنى تماماً حتى تصريح الجهات المختصة.']},
 {t:'فقدان طالبة أو نقص في الحصر', k:'none', r:'بحث مضبوط دون إعادة غير المدربين', s:['إعادة الحصر في نقطة التجمع والتحقق من السجلات.','عدم السماح لأي شخص غير مخوّل بالعودة إلى المبنى.','إبلاغ قائدة الإخلاء والدفاع المدني باسم المفقودة وآخر موقع متوقع.','فريق البحث المدرب للمناطق الآمنة فقط، والخطرة للدفاع المدني.']},

/* ---------- ترميز الرموز ---------- */
const b64 = s => { const b = new TextEncoder().encode(s); let bin = ''; for (const x of b) bin += String.fromCharCode(x); return btoa(bin); };
const unb64 = s => new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0)));
const encode = obj => 'HM2:' + b64(JSON.stringify(obj));
const bytesB64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const pipe = async (stream, bytes) => { const w = stream.writable.getWriter(); w.write(bytes); w.close(); return new Uint8Array(await new Response(stream.readable).arrayBuffer()); };
const encodeZ = async obj => { const s = JSON.stringify(obj); if (typeof CompressionStream === 'undefined') return encode(obj); return 'HM3:' + bytesB64(await pipe(new CompressionStream('deflate-raw'), new TextEncoder().encode(s))); };
const split = (text, max = 900) => { if (text.length <= max) return [text]; const id = rid(4), n = Math.ceil(text.length / max); return Array.from({length:n}, (_, i) => `HMP|${id}|${i + 1}|${n}|${text.slice(i * max, (i + 1) * max)}`); };
const qrSvg = text => { qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8']; const q = qrcode(0, text.length > 300 ? 'L' : 'M'); q.addData(text, 'Byte'); q.make(); return q.createSvgTag({cellSize:1, margin:3, scalable:true, alt:'رمز QR'}); };
const receive = async raw => {
  raw = String(raw || '').trim();
  if (raw.startsWith('HMP|')) {
    const [, id, i, n, ...rest] = raw.split('|');
    const b = partBuf[id] || (partBuf[id] = {n:+n, got:{}});
    b.got[i] = rest.join('|');
    const got = Object.keys(b.got).length;
    if (got < b.n) return {progress:[got, b.n]};
    raw = Array.from({length:b.n}, (_, k) => b.got[k + 1]).join('');
    delete partBuf[id];
  }
  if (raw.startsWith('HM3:')) { if (typeof DecompressionStream === 'undefined') throw new Error('هذا المتصفح قديم ولا يقرأ الرمز المضغوط'); return {obj:JSON.parse(new TextDecoder().decode(await pipe(new DecompressionStream('deflate-raw'), Uint8Array.from(atob(raw.slice(4)), c => c.charCodeAt(0)))))}; }
  if (!raw.startsWith('HM2:')) throw new Error('هذا ليس رمزاً من نظام تطبيق حماية');
  return {obj:JSON.parse(unb64(raw.slice(4)))};
};

const agg = e => {
  const matched = {}, unmatched = [];
  for (const [cid, rep] of Object.entries(e.reports)) for (const x of rep.e || []) {
    if (x[0] && clsById(x[0])) matched[x[0] + ':' + x[1]] = clsById(cid)?.name || '';
    else unmatched.push({name:x[1], by:clsById(cid)?.name || ''});
  }
  const rows = [], missing = [], pending = [], injured = [], foundList = [];
  for (const c of db.classes) {
    const rep = e.reports[c.id], act = activeSt(c);
    const row = {c, rep, reg:act.length, p:0, i:0, a:0, e:0, o:0, m:0, f:0, x:rep ? (rep.e || []).length : 0};
    if (rep) for (const s of act) {
      const info = rep.x[s.n] || {s:'p'}, k = c.id + ':' + s.n, fnd = matched[k] || (e.found || {})[k];
      if ((info.s === 'm' || info.s === 'o') && fnd) { row.f++; foundList.push({c, s, where:fnd}); continue; }
      row[info.s]++;
      if (info.s === 'm') missing.push({c, s, info, t:rep.t});
      if (info.s === 'o') pending.push({c, s, info, t:rep.t});
      if (info.s === 'i') injured.push({c, s, info});
    }
    rows.push(row);
  }
  const reported = rows.filter(r => r.rep);
  const all = reported.length === rows.length && rows.length > 0;
  const done = all ? Math.max(...reported.map(r => r.rep.t)) : null;
  const sum = k => rows.reduce((a, r) => a + r[k], 0);
  return {rows, missing, pending, injured, foundList, unmatched, reported:reported.length, total:rows.length, all, done, reg:sum('reg'), p:sum('p'), i:sum('i'), a:sum('a'), ex:sum('e'), o:sum('o'), m:sum('m'), f:sum('f'), extras:sum('x')};
};

};

const parseImport = text => {
  let added = 0, made = 0;
  for (const line of text.split(/\r?\n/)) {
    const p = line.split(/\t|;|,/).map(x => x.trim()).filter(Boolean);
    if (p.length < 2) continue;
    const [cn, sn, room] = p;
    if (/الفصل|الصف/.test(cn) && /اسم/.test(sn)) continue;
    let c = db.classes.find(x => norm(x.name) === norm(cn));
    if (!c) { c = {id:'c' + rid(5), name:cn, room:room || '', lv:1, st:[]}; db.classes.push(c); made++; }
    if (c.st.some(s => norm(s.name) === norm(sn))) continue;
    c.st.push({n:c.st.length + 1, name:sn, w:false});
    if (!c._touched) { c._touched = 1; if (c.st.length > 1) c.lv++; }
    added++;
  }
  db.classes.forEach(c => delete c._touched);
  db.master = true; save();
  return {added, made};
};

          if (det) { const r = await det.detect(v); if (r[0]) txt = r[0].rawValue; }
          else { const w = Math.min(640, v.videoWidth), h = Math.round(v.videoHeight * w / v.videoWidth); cv.width = w; cv.height = h; cx.drawImage(v, 0, 0, w, h); const q = jsQR(cx.getImageData(0, 0, w, h).data, w, h, {inversionAttempts:'dontInvert'}); if (q) txt = new TextDecoder().decode(new Uint8Array(q.binaryData)); }
          if (txt) handleScan(txt);
        } catch (e) {}
        busy = false;
      }
      camRAF = requestAnimationFrame(loop);
    };
    loop();
  } catch (e) { if (msg) msg.textContent = 'الكاميرا غير متاحة هنا. التقطي صورة للرمز بالزر أدناه.'; }
};
const decodeImage = file => new Promise(res => {
  const img = new Image(); img.onload = () => {
    const scales = [1, .6, .35];
    for (const sc of scales) {
      const max = 1400 * sc, k = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * k), h = Math.round(img.height * k), cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const cx = cv.getContext('2d'); cx.drawImage(img, 0, 0, w, h);
      const q = jsQR(cx.getImageData(0, 0, w, h).data, w, h, {inversionAttempts:'attemptBoth'});
      if (q) { URL.revokeObjectURL(img.src); return res(new TextDecoder().decode(new Uint8Array(q.binaryData))); }
    }
    URL.revokeObjectURL(img.src); res(null);
  };
  img.onerror = () => res(null); img.src = URL.createObjectURL(file);
});

  if (txt === lastScan) return; lastScan = txt; setTimeout(() => { if (lastScan === txt) lastScan = ''; }, 2500);

};
