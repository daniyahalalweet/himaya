<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f141c" media="(prefers-color-scheme: dark)">
<title>نظام تطبيق حماية</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/tajawal-arabic-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* VOICE  أداة عمل تُستخدم تحت الضغط: هادئة، واضحة، كبيرة الأزرار
   IDEA   لغة المواقع التعليمية الرسمية: شريط علوي داكن داخله قائمة بيضاء مستديرة، عنوان الصفحة ومسارها في الوسط، بطاقات بيضاء ناعمة، وتذييل أخضر
   COLOUR كحلي النص #344767، أخضر متدرّج #008675←#4AA090، الأحمر للخطر فقط، الكهرماني للانتظار
   TYPE   Tajawal بوزني 500 و700، محفوظ في مجلد fonts ليعمل دون اتصال
   LAYOUT حاوية 1320px، عمود واحد للجوال، وشبكات بطاقات على الحاسب */
@font-face{font-family:Tajawal;font-style:normal;font-weight:500;font-display:swap;src:url(fonts/tajawal-arabic-500-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:Tajawal;font-style:normal;font-weight:700;font-display:swap;src:url(fonts/tajawal-arabic-700-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:Tajawal;font-style:normal;font-weight:500;font-display:swap;src:url(fonts/tajawal-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Tajawal;font-style:normal;font-weight:700;font-display:swap;src:url(fonts/tajawal-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{color-scheme:light dark;
  --bg:light-dark(#f8f9fa,#0f141c);--card:light-dark(#ffffff,#18202c);--ink:light-dark(#344767,#e6ebf3);--mut:light-dark(#53565a,#a7b1c0);
  --line:light-dark(#e3e7ec,#2b3544);--inb:light-dark(#d2d6da,#3a4556);--hov:light-dark(#f3f5f8,#202a38);
  --g:#008675;--g1:#4aa090;--gt:light-dark(#007a6a,#5cc2ae);--g2:light-dark(#e6f4f1,#12302a);
  --grad:linear-gradient(310deg,#008675,#4aa090);--hero:linear-gradient(310deg,#335f63,#2e6277);
  --b2:linear-gradient(310deg,light-dark(#ced4da,#2b3544),light-dark(#ebeff4,#36425a));--b2t:light-dark(#3a416f,#e6ebf3);
  --r:#d7262e;--r2:light-dark(#fdeaea,#3a1517);--a:light-dark(#9a6400,#f0b43c);--a2:light-dark(#fff4da,#36290b);--n2:light-dark(#eceff3,#232c38);
  --hrc:light-dark(rgba(52,71,103,.5),rgba(230,235,243,.28));--rowc:light-dark(rgba(52,71,103,.16),rgba(230,235,243,.12));
  --shadow:0 20px 27px 0 rgba(0,0,0,.05);--bsh:0 4px 7px -1px rgba(0,0,0,.11),0 2px 4px -1px rgba(0,0,0,.07)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 16px/1.6 Tajawal,Tahoma,"Segoe UI","Noto Sans Arabic","Geeza Pro",sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
b,strong,th{font-weight:700}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.hero :focus-visible,.foot :focus-visible{outline-color:#fff}
.hero .pill :focus-visible{outline-color:var(--ink)}
svg.i{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- الشريط العلوي: القائمة والعنوان والمسار ---------- */
.hero{margin:16px;border-radius:12px;background:var(--hero);color:#fff;padding:24px 24px 16px;text-align:center}
.pill{position:relative;max-width:1224px;margin:0 auto;background:var(--card);color:var(--ink);border-radius:160px;box-shadow:0 4px 6px -1px rgba(20,20,20,.12),0 2px 4px -1px rgba(20,20,20,.07);display:flex;align-items:center;gap:8px;min-height:54px;padding:2px 20px;text-align:start}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px 4px;margin:0;cursor:pointer;color:inherit;text-align:start;border-radius:10px;flex:none}
.brand svg{width:36px;height:36px;flex:none}
.brand b{display:block;font-size:16px;line-height:1.25;color:var(--gt)}
.brand small{display:block;font-size:11px;line-height:1.3;color:var(--mut);max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navlist{list-style:none;margin:0;padding:0}
.navlist button{background:none;border:0;cursor:pointer;color:var(--ink);font-size:14px;line-height:22px;padding:8px;border-radius:8px;white-space:nowrap}
.navlist button:hover{color:var(--gt)}
.navlist button[aria-current=page]{color:var(--gt);font-weight:700}
.menuBtn{margin-inline-start:auto;width:44px;height:44px;border:0;background:none;color:var(--ink);border-radius:50%;cursor:pointer;display:grid;place-items:center;font-size:24px;padding:0}
.menuBtn .x,.pill.open .menuBtn .m{display:none}.pill.open .menuBtn .x{display:block}
@media(max-width:959.98px){
  .navlist{display:none;position:absolute;top:calc(100% + 8px);inset-inline-end:16px;width:min(246px,calc(100% - 32px));background:var(--card);border-radius:8px;padding:16px 8px;box-shadow:0 8px 26px -4px rgba(20,20,20,.15),0 8px 9px -5px rgba(20,20,20,.06);z-index:30}
  .pill.open .navlist{display:block}
  .navlist button{display:block;width:100%;text-align:start;padding:8px 16px;line-height:23px}
}
@media(min-width:960px){
  .menuBtn{display:none}
  .pill{padding:2px 40px}
  .navlist{display:flex;align-items:center;gap:0 6px;margin-inline-start:28px}
}
@media(min-width:1200px){.navlist{gap:0 16px;margin-inline-start:88px}}
.htext{padding:48px 8px 24px}.htext>*{max-width:1224px;margin-inline:auto}
.hero h1{font-size:24px;line-height:1.375;font-weight:700;margin:0;color:#fff}
.hero .lead{font-size:16px;line-height:1.6;margin:8px auto 0;max-width:960px;color:#fff}
.hero .lead .btn{min-height:34px;padding:0 12px;margin:2px 4px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.5);box-shadow:none;font-size:14px}
.crumbs{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;font-size:12px;line-height:1.4}
.crumbs li{display:flex;align-items:center}
.crumbs li+li::before{content:"/";margin:0 8px;font-size:14px}
.crumbs button,.crumbs [aria-current]{opacity:.85}
.crumbs button{background:none;border:0;padding:4px 2px;margin:0;color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:inherit;border-radius:4px}
.crumbs button:hover{opacity:1;text-decoration:underline}
.htext>.herocap{font-size:12px;line-height:1.25;margin:16px 0 0;max-width:none;text-align:start;padding-inline-start:32px;color:#fff}
@media(max-width:599.98px){.htext{padding:32px 0 16px}.htext>.herocap{padding-inline-start:0;text-align:center}}

/* ---------- المحتوى ---------- */
.wrap{max-width:1320px;margin:0 auto;padding:40px 24px 48px}
@media(max-width:599.98px){.wrap{padding:24px 16px 40px}}
h3{font-size:clamp(22px,.75vw + 19px,30px);line-height:1.15;font-weight:500;margin:40px 0 20px;color:var(--ink)}
.card>h3:first-child,.two>div>h3:first-child{margin-top:0}
.card>:last-child,.two>div>:last-child{margin-bottom:0}.card>.fields:last-child{margin-bottom:-16px}
p.lead{color:var(--mut);margin:0 0 16px}
.note{font-size:14px;color:var(--mut);margin:8px 0}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:40px;margin:0 0 24px}
.card .card{background:var(--bg);box-shadow:none;border-radius:12px;padding:20px 24px;margin:16px 0 0}
@media(max-width:599.98px){.card{padding:24px 20px;margin-bottom:16px}.card .card{padding:16px}}
.cards{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));align-items:start;margin:0 0 24px}
.cards>.card{margin:0}.cards>.full{grid-column:1/-1}
@media(max-width:599.98px){.cards{gap:16px}}
.fields{display:grid;gap:0 24px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.div{height:1px;border:0;background:linear-gradient(to left,transparent,var(--hrc),transparent);margin:16px 0 24px}
.two{display:grid;gap:16px 24px;align-items:start;margin-bottom:24px}@media(min-width:860px){.two{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}

/* الأزرار */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 24px;border-radius:8px;border:0;background:var(--b2);color:var(--b2t);cursor:pointer;font-weight:700;font-size:15px;line-height:1.3;text-decoration:none;box-shadow:var(--bsh)}
.btn.pri{background:var(--grad);color:#fff}
.btn.red{background:linear-gradient(310deg,#bf1d25,#e04a50);color:#fff}
.btn.big{min-height:60px;font-size:19px;width:100%}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 auto;min-height:46px;border-radius:8px;border:0;background:var(--b2);color:var(--b2t);cursor:pointer;padding:0 14px;font-weight:700;box-shadow:var(--bsh)}
.seg button[aria-pressed=true]{background:var(--grad);color:#fff}

/* الحقول */
label.f,.f{display:block;margin:0 0 16px}
label.f span,.f .lbl{display:block;font-size:14px;font-weight:700;color:var(--ink);margin-bottom:6px}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;font-size:16px;min-height:48px;padding:10px 14px;border:1px solid var(--inb);border-radius:8px;background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--g1);box-shadow:0 0 0 3px rgba(0,134,117,.28)}
input[type=checkbox]{accent-color:var(--g)}
textarea{min-height:120px;line-height:1.7}

/* التنبيهات */
.warn{background:var(--a2);border-inline-start:4px solid var(--a);border-radius:12px;padding:14px 18px;margin:0 0 16px;font-size:15px}
.alarm{background:var(--r2);border:2px solid var(--r);border-radius:16px;padding:16px 20px;margin:0 0 16px;color:var(--ink)}
.alarm h4{margin:0 0 6px;color:var(--r);font-size:19px;font-weight:700}
.okbox{background:var(--card);border-inline-start:4px solid var(--g);border-radius:16px;box-shadow:var(--shadow);padding:20px 24px;margin:0 0 16px}
.alarm .list,.warn .list{gap:8px}
.alarm .row,.warn .row{border-radius:10px;background-image:none;background-color:var(--card)}

/* الصفحة الرئيسية */
.tiles{display:grid;gap:16px;grid-template-columns:repeat(3,minmax(0,1fr));margin:0 0 24px}
.tiles.pri{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{background:var(--card);border:0;border-radius:16px;box-shadow:var(--shadow);padding:40px 24px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.tile .ic{width:40px;height:40px;color:var(--gt)}
.tile .tt{display:flex;flex-direction:column;gap:4px}
.tile b{font-size:20px;line-height:1.3}
.tile .d{font-size:16px;line-height:1.5;color:var(--mut)}
.tile.main{background:var(--grad);color:#fff}
.tile.main .ic{color:#fff;width:48px;height:48px}
.tile.main b{font-size:24px}
.tile.main .d{color:rgba(255,255,255,.92)}
@media(max-width:599.98px){
  .tiles{grid-template-columns:1fr;gap:12px;margin-bottom:16px}
  .tiles.pri{grid-template-columns:1fr 1fr}
  .tile{padding:24px 12px}
  .tile.main b{font-size:20px}.tile.main .d{font-size:14px}
  .tiles:not(.pri) .tile{flex-direction:row;justify-content:flex-start;text-align:start;padding:16px 20px;gap:16px}
  .tiles:not(.pri) .tile .ic{width:32px;height:32px}
  .tiles:not(.pri) .tile b{font-size:18px}.tiles:not(.pri) .tile .d{font-size:14px}
}

/* القوائم */
.list{display:flex;flex-direction:column;margin:12px 0}
.list>.btn+.btn{margin-top:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 12px;margin:0;border:0;border-inline-start:4px solid transparent;border-radius:0;background:linear-gradient(to left,transparent,var(--rowc),transparent) bottom/100% 1px no-repeat;color:inherit;cursor:pointer;text-align:start}
.row:last-child{background-image:none}
button.row:hover{background-color:var(--hov)}
.row .n{width:2.2em;color:var(--mut);font-variant-numeric:tabular-nums;flex:none}
.row .nm{flex:1;font-size:17px}
.row>input{flex:1}.row>label{flex:none;display:flex;align-items:center;gap:6px}
.row .sub{display:block;font-size:13px;color:var(--mut)}
.row.st-m{background-color:var(--r2);border-inline-start-color:var(--r)}.row.st-o,.row.st-i{border-inline-start-color:var(--a)}
#app>.list:not(:empty){background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:8px 16px;margin:0 0 24px}
@media(min-width:900px){#app>.list:not(:empty){display:block;columns:2;column-gap:48px;padding:16px 40px}#app>.list>.row{break-inside:avoid}}
.clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:0 32px}
.chip{display:inline-block;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;line-height:1.4;white-space:nowrap;flex:none}
.c-p,.c-f{background:var(--g2);color:var(--gt)}.c-i,.c-o{background:var(--a2);color:var(--a)}.c-a,.c-e{background:var(--n2);color:var(--mut)}.c-m{background:var(--r);color:#fff}

/* شبكة الفصول والأرقام */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:12px;margin:12px 0 24px}
.cls{border-radius:12px;padding:14px 16px;min-height:88px;border:2px solid transparent;background:var(--card);box-shadow:0 6px 16px rgba(0,0,0,.06);cursor:pointer;text-align:start;display:flex;flex-direction:column;gap:2px;color:inherit}
.card .cls,.sheet .cls{box-shadow:none;border-color:var(--line)}
.cls b{font-size:20px}.cls span{font-size:13px;color:var(--mut)}
.cls.ok{border-color:var(--g1);background:var(--g2)}.cls.bad{border-color:var(--r);background:var(--r2)}.cls.wait{border-color:var(--a);background:var(--a2)}
.timer{font-size:clamp(52px,8vw,72px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em;margin:4px 0 8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:16px;margin:0 0 24px}
.stat{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px 20px}
.stat b{display:block;font-size:28px;line-height:1.2;font-variant-numeric:tabular-nums}.stat span{font-size:14px;color:var(--mut)}
.stat.r b{color:var(--r)}.stat.a b{color:var(--a)}
@media(max-width:599.98px){.stats{gap:12px;margin-bottom:16px}.stat{padding:14px 16px}}

/* الجداول */
.scroll{overflow-x:auto}
#app>.scroll{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:8px 24px;margin:0 0 24px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:12px 10px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
thead th{font-size:13px;color:var(--mut);border-bottom-width:2px}
tbody tr:last-child>*{border-bottom:0}
tbody th{background:var(--bg)}
td.l{text-align:start;white-space:normal;min-width:8em}

/* الرمز والفرضيات */
.qr{background:#fff;padding:12px;border-radius:16px;max-width:340px;margin:12px auto;border:1px solid var(--line)}
.qr svg{display:block;width:100%;height:auto}
.center{text-align:center}
.scen{border-inline-start:5px solid var(--line);padding:16px 24px;margin:0 0 16px}
.k-out{border-inline-start-color:var(--g)}.k-in{border-inline-start-color:var(--a)}.k-lock{border-inline-start-color:var(--r)}.k-none{border-inline-start-color:var(--mut)}.k-mix{border-inline-start-color:var(--g1)}
.scen ol{margin:8px 0 0;padding-inline-start:26px;list-style:arabic-indic}
.scen li{margin:4px 0}
details summary{cursor:pointer;font-weight:700;font-size:17px;min-height:44px;display:flex;align-items:center;gap:12px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"";margin-inline-start:auto;flex:none;width:9px;height:9px;border:solid var(--mut);border-width:0 2px 2px 0;transform:translateY(-2px) rotate(45deg)}
details[open] summary::after{transform:translateY(2px) rotate(-135deg)}
.scenlist{display:grid;gap:0 24px;align-items:start}@media(min-width:960px){.scenlist{grid-template-columns:1fr 1fr}}

/* الشريط السفلي والنوافذ */
.bar{position:fixed;inset-inline:0;bottom:0;background:var(--card);box-shadow:0 -8px 24px rgba(20,23,39,.09);padding:12px max(16px,calc((100% - 1272px)/2)) calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;z-index:15}
.bar .cnt{flex:1;font-size:14px;line-height:1.3;color:var(--mut)}.bar .cnt b{font-size:24px;display:block;color:var(--ink)}
.scrim{position:fixed;inset:0;background:rgba(20,23,39,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);color:var(--ink);width:min(640px,100%);max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:24px max(16px,4vw) calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 8px 26px -4px rgba(20,20,20,.2)}
.sheet:focus{outline:0}
.sheet h3{margin:0 0 12px;font-size:20px;font-weight:700;line-height:1.35}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:16px;padding:32px}}
.toast{position:fixed;inset-inline:16px;bottom:96px;margin:auto;max-width:520px;background:#1d2a3f;color:#fff;border-radius:12px;padding:12px 16px;z-index:60;text-align:center;box-shadow:0 8px 26px -4px rgba(20,20,20,.3)}
video{width:100%;border-radius:12px;background:#000;max-height:50vh}

/* التذييل */
.foot{background:var(--grad);color:#fff;padding:48px 0 24px}
.hasbar .foot{padding-bottom:104px}
.foot .in{max-width:1320px;margin:0 auto;padding:0 24px}
.fcols{display:flex;flex-wrap:wrap;justify-content:center;gap:24px 0;text-align:center}
.fcol{width:216px;padding:0 12px}
.fcol h2{font-size:14px;font-weight:700;line-height:1.5;margin:0 0 8px}
.fcol ul{list-style:none;margin:0;padding:0}
.fcol button{background:none;border:0;color:#fff;font-size:14px;line-height:21px;padding:2px 4px 4px;cursor:pointer;border-radius:4px}
.fcol button:hover{text-decoration:underline}
.fbrand{width:324px;display:flex;flex-direction:column;align-items:center;gap:8px}
.fbrand svg{width:64px;height:64px}
.fbrand b{font-size:20px;line-height:1.3}.fbrand span{font-size:13px;opacity:.9}
.foot .div{background:linear-gradient(to left,transparent,rgba(255,255,255,.5),transparent);margin:32px 0 16px}

const b64 = s => { const b = new TextEncoder().encode(s); let bin = ''; for (const x of b) bin += String.fromCharCode(x); return btoa(bin); };
const unb64 = s => new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0)));
const encode = obj => 'HM2:' + b64(JSON.stringify(obj));
const bytesB64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const pipe = async (stream, bytes) => { const w = stream.writable.getWriter(); w.write(bytes); w.close(); return new Uint8Array(await new Response(stream.readable).arrayBuffer()); };
const encodeZ = async obj => { const s = JSON.stringify(obj); if (typeof CompressionStream === 'undefined') return encode(obj); return 'HM3:' + bytesB64(await pipe(new CompressionStream('deflate-raw'), new TextEncoder().encode(s))); };
const split = (text, max = 900) => { if (text.length <= max) return [text]; const id = rid(4), n = Math.ceil(text.length / max); return Array.from({length:n}, (_, i) => `HMP|${id}|${i + 1}|${n}|${text.slice(i * max, (i + 1) * max)}`); };
const qrSvg = text => { qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8']; const q = qrcode(0, text.length > 300 ? 'L' : 'M'); q.addData(text, 'Byte'); q.make(); return q.createSvgTag({cellSize:1, margin:3, scalable:true, alt:'رمز QR'}); };
const receive = async raw => {
  raw = String(raw || '').trim();
  if (raw.startsWith('HMP|')) {
    const [, id, i, n, ...rest] = raw.split('|');
    const b = partBuf[id] || (partBuf[id] = {n:+n, got:{}});
    b.got[i] = rest.join('|');
    const got = Object.keys(b.got).length;
    if (got < b.n) return {progress:[got, b.n]};
    raw = Array.from({length:b.n}, (_, k) => b.got[k + 1]).join('');
    delete partBuf[id];
  }
  if (raw.startsWith('HM3:')) { if (typeof DecompressionStream === 'undefined') throw new Error('هذا المتصفح قديم ولا يقرأ الرمز المضغوط'); return {obj:JSON.parse(new TextDecoder().decode(await pipe(new DecompressionStream('deflate-raw'), Uint8Array.from(atob(raw.slice(4)), c => c.charCodeAt(0)))))}; }
  if (!raw.startsWith('HM2:')) throw new Error('هذا ليس رمزاً من نظام تطبيق حماية');
  return {obj:JSON.parse(unb64(raw.slice(4)))};
};

const agg = e => {
  const matched = {}, unmatched = [];
  for (const [cid, rep] of Object.entries(e.reports)) for (const x of rep.e || []) {
    if (x[0] && clsById(x[0])) matched[x[0] + ':' + x[1]] = clsById(cid)?.name || '';
    else unmatched.push({name:x[1], by:clsById(cid)?.name || ''});
  }
  const rows = [], missing = [], pending = [], injured = [], foundList = [];
  for (const c of db.classes) {
    const rep = e.reports[c.id], act = activeSt(c);
    const row = {c, rep, reg:act.length, p:0, i:0, a:0, e:0, o:0, m:0, f:0, x:rep ? (rep.e || []).length : 0};
    if (rep) for (const s of act) {
      const info = rep.x[s.n] || {s:'p'}, k = c.id + ':' + s.n, fnd = matched[k] || (e.found || {})[k];
      if ((info.s === 'm' || info.s === 'o') && fnd) { row.f++; foundList.push({c, s, where:fnd}); continue; }
      row[info.s]++;
      if (info.s === 'm') missing.push({c, s, info, t:rep.t});
      if (info.s === 'o') pending.push({c, s, info, t:rep.t});
      if (info.s === 'i') injured.push({c, s, info});
    }
    rows.push(row);
  }
  const reported = rows.filter(r => r.rep);
  const all = reported.length === rows.length && rows.length > 0;
  const done = all ? Math.max(...reported.map(r => r.rep.t)) : null;
  const sum = k => rows.reduce((a, r) => a + r[k], 0);
  return {rows, missing, pending, injured, foundList, unmatched, reported:reported.length, total:rows.length, all, done, reg:sum('reg'), p:sum('p'), i:sum('i'), a:sum('a'), ex:sum('e'), o:sum('o'), m:sum('m'), f:sum('f'), extras:sum('x')};
};

const parseImport = text => {
  let added = 0, made = 0;
  for (const line of text.split(/\r?\n/)) {
    const p = line.split(/\t|;|,/).map(x => x.trim()).filter(Boolean);
    if (p.length < 2) continue;
    const [cn, sn, room] = p;
    if (/الفصل|الصف/.test(cn) && /اسم/.test(sn)) continue;
    let c = db.classes.find(x => norm(x.name) === norm(cn));
    if (!c) { c = {id:'c' + rid(5), name:cn, room:room || '', lv:1, st:[]}; db.classes.push(c); made++; }
    if (c.st.some(s => norm(s.name) === norm(sn))) continue;
    c.st.push({n:c.st.length + 1, name:sn, w:false});
    if (!c._touched) { c._touched = 1; if (c.st.length > 1) c.lv++; }
    added++;
  }
  db.classes.forEach(c => delete c._touched);
  db.master = true; save();
  return {added, made};
};

let camStream = null, camRAF = 0;

const scanDlg = kind => {

const startCam = async () => {
  const msg = $('#scanMsg');
  try {
    camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
    const v = $('#cam'); if (!v) return stopCam();
    v.srcObject = camStream; v.hidden = false; await v.play();
    msg.textContent = 'وجّهي الكاميرا نحو الرمز';
    const cv = document.createElement('canvas'), cx = cv.getContext('2d', {willReadFrequently:true});
    const det = 'BarcodeDetector' in window ? new BarcodeDetector({formats:['qr_code']}) : null;
    let busy = false;
    const loop = async () => {
      if (!camStream || !$('#cam')) return;
      if (!busy && v.readyState >= 2) {
        busy = true;
        try {
          let txt = null;
          if (det) { const r = await det.detect(v); if (r[0]) txt = r[0].rawValue; }
          else { const w = Math.min(640, v.videoWidth), h = Math.round(v.videoHeight * w / v.videoWidth); cv.width = w; cv.height = h; cx.drawImage(v, 0, 0, w, h); const q = jsQR(cx.getImageData(0, 0, w, h).data, w, h, {inversionAttempts:'dontInvert'}); if (q) txt = new TextDecoder().decode(new Uint8Array(q.binaryData)); }
          if (txt) handleScan(txt);
        } catch (e) {}
        busy = false;
      }
      camRAF = requestAnimationFrame(loop);
    };
    loop();
  } catch (e) { if (msg) msg.textContent = 'الكاميرا غير متاحة هنا. التقطي صورة للرمز بالزر أدناه.'; }
};
const decodeImage = file => new Promise(res => {
  const img = new Image(); img.onload = () => {
    const scales = [1, .6, .35];
    for (const sc of scales) {
      const max = 1400 * sc, k = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * k), h = Math.round(img.height * k), cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const cx = cv.getContext('2d'); cx.drawImage(img, 0, 0, w, h);
      const q = jsQR(cx.getImageData(0, 0, w, h).data, w, h, {inversionAttempts:'attemptBoth'});
      if (q) { URL.revokeObjectURL(img.src); return res(new TextDecoder().decode(new Uint8Array(q.binaryData))); }
    }
    URL.revokeObjectURL(img.src); res(null);
  };
  img.onerror = () => res(null); img.src = URL.createObjectURL(file);
});
let lastScan = '';
const handleScan = async txt => {

  go:b => { if (b.dataset.v === 'teacher' && db.ts) { go(db.ts.t ? 'tdone' : 'tlist'); return; } go(b.dataset.v, b.dataset.arg || null); },
  close:() => closeSheet(),
  closeScrim:(b, e) => { if (e.target === b) closeSheet(); },
  confirmYes:() => { const cb = confirmCb; confirmCb = null; closeSheet(); cb && cb(); },
  demo:() => { const run = () => { demo(); render(); toast('حُمّلت ٨ فصول ببيانات تجريبية'); }; db.classes.length ? ask('استبدال القوائم الحالية ببيانات تجريبية؟', run, 'استبدال') : run(); },
  addCls:() => clsDlg(null),
  editCls:b => clsDlg(clsById(b.dataset.id)),
  saveCls:b => {
    const name = $('#c-name').value.trim(); if (!name) return toast('اكتبي اسم الفصل');
    let c = clsById(b.dataset.id), changed = false;
    if (!c) { c = {id:'c' + rid(5), name, room:'', lv:1, st:[]}; db.classes.push(c); }
    if (c.name !== name) { c.name = name; changed = true; }
    const room = $('#c-room').value.trim(); if (c.room !== room) { c.room = room; }
    document.querySelectorAll('[data-sn]').forEach(i => { const s = c.st.find(x => x.n === +i.dataset.sn); const v = i.value.trim(); if (s && v && v !== s.name) { s.name = v; changed = true; } });
    document.querySelectorAll('[data-sw]').forEach(i => { const s = c.st.find(x => x.n === +i.dataset.sw); if (s && s.w !== i.checked) { s.w = i.checked; changed = true; } });
    for (const line of $('#c-add').value.split(/\r?\n/)) { const v = line.trim(); if (v) { c.st.push({n:c.st.length + 1, name:v, w:false}); changed = true; } }
    if (changed && b.dataset.id) c.lv++;
    delete c.demo; db.master = true; save(); closeSheet(); render(); toast('حُفظ الفصل' + (changed && b.dataset.id ? ' — انقلي القوائم المحدّثة للمعلمات' : ''));
  },
  delCls:b => ask('حذف هذا الفصل وقائمته؟', () => { db.classes = db.classes.filter(c => c.id !== b.dataset.id); save(); render(); }, 'حذف'),
  importDlg:() => sheet(`<h3>استيراد من Excel</h3><p class="note">انسخي من Excel عمودين متجاورين: الفصل ثم اسم الطالبة (والعمود الثالث اختياري: القاعة)، والصقيها هنا. يمكنك نسخها من كشوف نور بعد ترتيبها.</p><textarea id="imp" rows="10" placeholder="٢/ب	نورة محمد ..."></textarea><div class="btns"><button type="button" class="btn pri" data-a="doImport">استيراد</button><button type="button" class="btn" data-a="close">إلغاء</button></div>`),
  doImport:() => { const r = parseImport($('#imp').value); closeSheet(); render(); toast(r.added ? `أُضيفت ${r.added} طالبة${r.made ? ` في ${r.made} فصول جديدة` : ''}` : 'لم يُعثر على صفوف صالحة: فصل ثم اسم'); },
  showPkg:() => sheet(`<h3>أي القوائم تنقلين؟</h3><p class="note">قد تكون المعلمة مع أي فصل وقت الإنذار، لذلك الأفضل نقل كل الفصول.</p><button type="button" class="btn pri big" data-a="pkgQR" data-id="">كل الفصول</button><div class="grid">${db.classes.map(c => `<button type="button" class="cls" data-a="pkgQR" data-id="${c.id}"><b>${esc(c.name)}</b><span>فصل واحد</span></button>`).join('')}</div><button type="button" class="btn" data-a="close">إغلاق</button>`),
  pkgQR:async b => { const p = split(await pkgText(b.dataset.id || null)); showQR(p, b.dataset.id ? 'رمز قائمة ' + clsById(b.dataset.id).name : 'رمز قوائم كل الفصول', p.length > 1 ? `القوائم في ${AR(p.length)} رموز. تمسحها المعلمة بالترتيب من شاشة «المعلمة».` : 'تمسحه المعلمة من شاشة «المعلمة».'); },
  qrNext:() => { qrPages.i++; drawQR(); }, qrPrev:() => { qrPages.i--; drawQR(); },
  dlPkg:async () => download('himaya-lists.json', await pkgText(), 'text/plain'),
  copyPkg:async () => { const t = await pkgText(); sheet(`<h3>نص القوائم</h3><textarea id="cp" rows="6" readonly>${esc(t)}</textarea><div class="btns"><button type="button" class="btn pri" data-a="copyTx" data-t="cp">نسخ</button><button type="button" class="btn" data-a="close">إغلاق</button></div>`); },
  dlBackup:async () => { db.lastBackup = now(); save(); await download('himaya-backup-' + new Date().toISOString().slice(0, 10) + '.json', await encodeZ({k:'backup', db})); render(); },
  copyBackup:async () => { db.lastBackup = now(); save(); sheet(`<h3>النسخة الاحتياطية كنص</h3><textarea id="cp" rows="6" readonly>${esc(await encodeZ({k:'backup', db}))}</textarea><div class="btns"><button type="button" class="btn pri" data-a="copyTx" data-t="cp">نسخ</button><button type="button" class="btn" data-a="close">إغلاق</button></div>`); },
  openJson:() => $('#fJson').click(),
  pasteDlg:() => sheet(`<h3>لصق نص</h3><p class="note">ألصقي نص القوائم أو النسخة الاحتياطية.</p><textarea id="pst" rows="6"></textarea><div class="btns"><button type="button" class="btn pri" data-a="doPaste">متابعة</button><button type="button" class="btn" data-a="close">إلغاء</button></div>`),
  doPaste:async () => { try { const o = await receive($('#pst').value); if (o.obj) handleObj(o.obj); else toast('النص ناقص'); } catch (e) { toast(e.message || 'النص غير صالح'); } },
  wipe:() => ask('مسح كل بيانات هذا الجهاز نهائياً؟ احفظي نسخة أولاً.', () => { db = fresh(); save(); go('home'); }, 'مسح'),
  tStart:b => startTeacher(b.dataset.id),
  setLoc:b => { db.ts.loc = b.dataset.k; save(); closeSheet(); render(); },
  relocate:() => { if (db.view === 'tlist') locDlg(); else sheet(`<h3>موقع الفصل</h3><div class="list">${Object.entries(LOC).map(([k, v]) => `<button type="button" class="btn big" data-a="oLoc" data-k="${k}">${v}</button>`).join('')}</div>`); },
  oLoc:b => { edit.ref.loc = b.dataset.k; closeSheet(); render(); },
  pick:b => pickDlg(+b.dataset.n),
  setSt:b => { const ed = curEdit(), n = +b.dataset.n, k = b.dataset.k; if (k === 'p') delete ed.ref.x[n]; else ed.ref.x[n] = Object.assign({}, ed.ref.x[n] || {}, {s:k}); if (k !== 'm') { delete ed.ref.x[n]?.l; } save(); if (k === 'm') lastDlg(n); else { closeSheet(); render(); } },
  setLast:b => { const ed = curEdit(), n = +b.dataset.n; ed.ref.x[n] = Object.assign(ed.ref.x[n] || {s:'m'}, {s:'m', l:b.dataset.k, note:($('#lastNote')?.value || '').trim()}); save(); closeSheet(); render(); },
  extraDlg:() => extraDlg(),
  extraCls:b => extraDlg(b.dataset.id),
  extraAdd:b => { const ed = curEdit(), k = [b.dataset.id, +b.dataset.n]; if (!ed.ref.e.some(x => x[0] === k[0] && x[1] === k[1])) ed.ref.e.push(k); save(); closeSheet(); render(); },
  extraFree:() => { const v = $('#exName').value.trim(); if (!v) return toast('اكتبي الاسم'); curEdit().ref.e.push([0, v]); save(); closeSheet(); render(); },
  delExtra:b => { curEdit().ref.e.splice(+b.dataset.i, 1); save(); render(); },
  tCancel:() => ask('إلغاء هذا الحصر؟', () => { db.ts = null; go('teacher'); }, 'إلغاء الحصر'),
  tFinish:() => { db.ts.t = now(); if (!db.ts.loc) db.ts.loc = 'room'; save(); go('tdone'); },
  rate:b => { db.ts.r = +b.dataset.v; save(); render(); },
  tEdit:() => { db.ts.t = null; save(); go('tlist'); },
  tNew:() => { db.ts = null; save(); go('teacher'); },
  selfSubmit:() => { applyResult(JSON.parse(unb64(resultPayload().slice(4)))); },
  nType:b => { newType = b.dataset.k; render(); },
  startEv:() => { const e = {id:'e' + rid(6), type:newType, scen:+$('#nScen').value, start:now(), evac:null, end:null, reports:{}, found:{}}; db.events.push(e); db.active = e.id; save(); render(); },
  evac:() => { const e = ev(); e.evac = e.evac ? null : now(); save(); render(); },
  showScen:() => { const e = ev(); sheet(scenCard(SCEN[e.scen], e.scen, true) + '<button type="button" class="btn" data-a="close">إغلاق</button>'); },
  scan:b => scanDlg(b.dataset.for),
  photo:() => $('#fPhoto').click(), pickImg:() => $('#fImg').click(),
  found:b => { const e = ev(); (e.found = e.found || {})[b.dataset.k] = 'تأكيد يدوي'; save(); render(); },
  clsSheet:b => clsSheetDlg(b.dataset.id),
  manualAll:b => { const e = ev(); e.reports[b.dataset.id] = {t:now(), by:'', l:'room', via:'manual', x:{}, e:[], r:null, lvOk:true}; save(); closeSheet(); render(); toast('سُجّل الفصل مكتملاً'); },
  manualList:b => { const e = ev(), rep = e.reports[b.dataset.id]; edit = {mode:'o', ref:{cid:b.dataset.id, loc:rep?.l || 'room', x:JSON.parse(JSON.stringify(rep?.x || {})), e:JSON.parse(JSON.stringify(rep?.e || []))}}; closeSheet(); db.view = 'olist'; render(); window.scrollTo(0, 0); },
  oSave:() => { const e = ev(), r = edit.ref, old = e.reports[r.cid]; e.reports[r.cid] = {t:old?.t || now(), by:old?.by || '', l:r.loc, via:old?.via || 'manual', x:r.x, e:r.e, r:old?.r || null, lvOk:old ? old.lvOk : true}; edit = null; save(); go('officer'); toast('حُفظ الحصر'); },
  unreport:b => ask('إلغاء بلاغ هذا الفصل؟', () => { delete ev().reports[b.dataset.id]; save(); render(); }, 'إلغاء البلاغ'),
  endEv:() => { const e = ev(), a = agg(e); ask(a.all ? (a.m ? 'توجد مفقودات. إنهاء الحدث وعرض التقرير؟' : 'إنهاء الحدث وعرض التقرير؟') : `لم تبلّغ ${a.total - a.reported} فصول بعد. إنهاء رغم ذلك؟`, () => { e.end = now(); db.active = null; save(); queueSummary(e); go('report', e.id); }, 'إنهاء'); },
  copyTx:b => { const el = document.getElementById(b.dataset.t); copy(el.value, el); },
  dlImpact:() => download('himaya-impact.txt', $('#tx-impact').value, 'text/plain'),
  print:() => { try { window.print(); } catch (e) { toast('الطباعة غير متاحة هنا'); } },
  adminIn:async () => { try { await adminLogin($('#ad-mail').value.trim(), $('#ad-pass').value); render(); await adminLoad(); render(); } catch (e) { adminTok = null; toast(e.message || 'تعذّر الدخول'); render(); } },
  adminReload:async () => { try { await adminLoad(); render(); toast('حُدّثت البيانات'); } catch (e) { toast(e.message); } },
  adminCsv:() => { const H = ['التاريخ','المدرسة','المرحلة','النوع','رقم الفرضية','الفرضية','عدد الفصول','المسجلات','الحاضرات اليوم','زمن الإخلاء (ث)','زمن الحصر (ث)','الحصر الورقي (د)','مفقودات غير محلولة','طوبقت تلقائياً','فصول بالرمز','فصول يدوياً','اختلاف إصدار القائمة','متوسط السهولة','عدد التقييمات','رمز المدرسة'];
    const K = ['date','school','stage','type','scen','scenTitle','classes','registered','presentToday','evacSec','countSec','baselineMin','unresolved','autoMatched','qr','manual','lvMismatch','rateAvg','rateN','sid'];
    const q = v => { const t = String(v ?? ''); return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
    download('himaya-impact-' + new Date().toISOString().slice(0, 10) + '.csv', '\ufeff' + [H.join(','), ...adminRows.map(r => K.map(k => q(r[k] === -1 ? '' : r[k])).join(','))].join('\r\n'), 'text/csv'); },
  delEv:b => ask('حذف هذا الحدث وتقريره؟', () => { db.events = db.events.filter(e => e.id !== b.dataset.id); if (db.active === b.dataset.id) db.active = null; save(); go('history'); }, 'حذف')
};
document.addEventListener('click', e => { if ($('#pill').classList.contains('open') && !e.target.closest('#pill')) setMenu(false); const b = e.target.closest('[data-a]'); if (!b || b.disabled) return; const f = A[b.dataset.a]; if (f) f(b, e); });
document.addEventListener('focusin', e => { if ($('#pill').classList.contains('open') && !e.target.closest('#pill')) setMenu(false); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#pill').classList.contains('open')) { setMenu(false); $('.menuBtn').focus(); }
  else if ($('#layer').firstElementChild) closeSheet();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.f) { const path = t.dataset.f.split('.'); if (path.length === 2) db[path[0]][path[1]] = t.value.trim(); else db[path[0]] = t.value.trim(); save(); if (t.dataset.f === 'school.name') $('#sub').textContent = t.value.trim() || 'النسخة الميدانية'; }
  if (t.id === 's-share') { db.share = t.checked; save(); flush(); }
  if (t.id === 'nScen') { newScen = +t.value; $('#nScenCard').innerHTML = scenCard(SCEN[newScen], newScen, true); }
});
document.addEventListener('input', e => { if (e.target.id === 'exQ') { const q = norm(e.target.value); document.querySelectorAll('#exList [data-q]').forEach(r => { r.hidden = q && !r.dataset.q.includes(q); }); } });
const onImg = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; const m = $('#scanMsg'); if (m) m.textContent = 'جارٍ قراءة الصورة…'; const txt = await decodeImage(f); if (txt) handleScan(txt); else if ($('#scanMsg')) $('#scanMsg').textContent = 'لم يُقرأ الرمز. قرّبي الصورة واجعلي الرمز واضحاً.'; };
$('#fPhoto').addEventListener('change', onImg); $('#fImg').addEventListener('change', onImg);
$('#fJson').addEventListener('change', async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; try { const t = await f.text(); let o; try { o = await receive(t); } catch (x) { const j = JSON.parse(t); o = {obj:j.k ? j : {k:'backup', db:j}}; } if (o.obj) handleObj(o.obj); } catch (x) { toast('الملف غير صالح'); } });
const tick = () => document.querySelectorAll('[data-tick]').forEach(el => { el.textContent = mmss(now() - +el.dataset.tick); });
setInterval(tick, 1000);
if ('serviceWorker' in navigator && !inFrame && (location.protocol === 'https:' || location.hostname === 'localhost')) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
if (db.view === 'olist') db.view = 'officer';
if (db.view === 'admin') db.view = 'home';
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
window.addEventListener('online', flush);
setInterval(flush, 60000);
render();
flush();
}
</script>
</body>
</html>
